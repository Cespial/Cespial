name: Profile statistics

# Rebuilds the cards shown in README.md and publishes them on the `stats`
# branch, so `main` does not collect a commit every day.
#
# - Statistics need one secret, STATS_TOKEN: a fine-grained personal access
#   token of the account owner, read-only, "All repositories", with the
#   permissions "Metadata: read" and "Deployments: read". Only totals are output.
# - Product cards need no secret: they are screenshots of the public sites.
#
# Whatever cannot be rebuilt on a given day keeps its last published version.
#
# There is deliberately no pull_request trigger: a fork must never be able to
# run this with the secret.

on:
  schedule:
    - cron: "17 9 * * *" # 04:17 in Bogotá
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start from the last published cards
        run: |
          mkdir dist
          if git clone --quiet --depth 1 --branch stats \
              "https://github.com/${GITHUB_REPOSITORY}.git" previous; then
            cp previous/*.svg previous/*.json dist/ 2>/dev/null || true
            rm -rf previous
          fi

      - name: Build the statistics cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::warning::STATS_TOKEN is not set; the statistics keep their last published numbers."
            exit 0
          fi
          python3 scripts/build_stats.py --out dist

      - name: Build the product cards
        run: |
          python3 -m pip install --quiet "pillow==12.3.0"
          python3 scripts/build_products.py --out dist

      - name: Publish to the stats branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init --quiet --initial-branch=stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Update profile statistics"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
